<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#13251a" />
  <meta name="description" content="Copparì: cabina di regia completa, offline e intuitiva per tornei di calcetto." />
  <meta name="color-scheme" content="light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Copparì" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/coppari-icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png" />
  <link rel="preload" as="image" type="image/webp" href="./assets/coppari-logo.webp" />
  <title>Copparì — Cabina di regia</title>
  <style>
:root {
  --bg: #f4f5ef;
  --panel: #ffffff;
  --panel-2: #eef1e7;
  --ink: #152019;
  --muted: #6d756e;
  --line: #dfe4db;
  --brand: #254d35;
  --brand-2: #d5ed7a;
  --danger: #b33939;
  --warn: #c88c27;
  --shadow: 0 12px 35px rgba(21, 32, 25, 0.08);
  --radius: 18px;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: not-allowed; filter: none !important; }

.app-shell { min-height: 100vh; display: grid; grid-template-columns: 250px 1fr; }
.sidebar { position: sticky; top: 0; height: 100vh; background: #101b14; color: white; padding: 22px 16px; display: flex; flex-direction: column; z-index: 20; }
.brand { display: flex; gap: 12px; align-items: center; padding: 0 8px 24px; }
.brand-mark { width: 42px; height: 42px; display: grid; place-items: center; flex:0 0 auto; }
.brand-mark img { display:block; width:100%; height:100%; object-fit:contain; }
.brand strong { display:block; font-size: 20px; }
.brand span { display:block; color: #9eaa9f; font-size: 12px; margin-top: 2px; }
.nav { display: grid; gap: 7px; }
.nav-item { border: 0; background: transparent; color: #c8d0ca; text-align: left; padding: 12px 14px; border-radius: 12px; display: flex; gap: 10px; align-items: center; }
.nav-item:hover, .nav-item.active { background: #1d2d22; color: white; }
.sidebar-footer { margin-top: auto; display: grid; gap: 8px; }

.main { min-width: 0; }
.topbar { padding: 25px 30px 10px; display: flex; align-items: center; gap: 14px; }
.topbar h1 { margin: 0; font-size: 28px; }
.topbar p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
.topbar-actions { margin-left: auto; }
.menu-btn { display:none; border:0; background:var(--panel); border-radius: 10px; padding: 9px 11px; box-shadow: var(--shadow); }
.content { padding: 18px 30px 50px; }

.grid { display:grid; gap: 16px; }
.grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
.card h3 { margin: 0 0 12px; font-size: 17px; }
.metric { font-size: 34px; line-height:1; font-weight: 850; margin-top: 8px; }
.metric-label { color: var(--muted); font-size: 13px; }
.section-head { display:flex; gap: 12px; align-items:center; margin: 8px 0 14px; }
.section-head h2 { margin:0; font-size:20px; }
.section-head .actions { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }

.primary, .secondary, .ghost, .danger { border:0; border-radius: 11px; padding: 10px 14px; font-weight: 700; }
.primary { background: var(--brand); color:white; }
.primary:hover { filter: brightness(1.05); }
.secondary { background: var(--brand-2); color:#182019; }
.ghost { background: transparent; border:1px solid var(--line); color:inherit; }
.sidebar .ghost { border-color:#33453a; color:#dce3dd; }
.danger { background:#fbe6e6; color:var(--danger); }
.full { width:100%; text-align:center; }
.file-label { display:block; cursor:pointer; }

.table-wrap { overflow:auto; border-radius:14px; border:1px solid var(--line); }
table { width:100%; border-collapse:collapse; background:var(--panel); }
th, td { padding: 12px 14px; border-bottom: 1px solid var(--line); white-space:nowrap; font-size:14px; text-align:left; }
th { background:#f7f8f4; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
tr:last-child td { border-bottom:0; }
.rank { width: 28px; height: 28px; display:grid; place-items:center; border-radius:9px; background:var(--panel-2); font-weight:800; }

.badge { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding: 5px 9px; background: var(--panel-2); font-size:12px; font-weight:700; }
.badge.green { background:#e4f2df; color:#285332; }
.badge.red { background:#f6dede; color:#8a2727; }
.badge.yellow { background:#f8edc9; color:#7d5b14; }

.empty { padding: 38px 20px; text-align:center; color:var(--muted); border:1px dashed #ccd3c8; border-radius:14px; background:#fafbf8; }
.empty strong { display:block; color:var(--ink); margin-bottom:6px; }

.form-grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px; }
.field { display:grid; gap:6px; }
.field.full { grid-column:1/-1; }
.field label { font-size:12px; font-weight:800; color:var(--muted); }
.field input, .field select { width:100%; border:1px solid var(--line); background:white; color:var(--ink); border-radius:10px; padding:10px 11px; outline:none; }
.field input:focus, .field select:focus { border-color:#91aa97; box-shadow: 0 0 0 3px rgba(37,77,53,.09); }
.team-name-random { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:stretch; }
.team-name-random .dice-name { min-width:48px; padding:9px 12px; font-size:20px; line-height:1; }

.team-grid { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:16px; }
.team-card { position:relative; overflow:hidden; }
.team-accent { position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--team); }
.team-card h3 { padding-left:3px; margin-bottom:5px; }
.team-meta { color:var(--muted); font-size:12px; margin-bottom:12px; }
.roster { display:grid; gap:7px; }
.roster-row { display:flex; align-items:center; gap:8px; padding:8px 9px; border-radius:10px; background:#f7f8f4; }
.roster-row .grow { flex:1; }
.rating { letter-spacing:1px; font-size:11px; color:#c4891e; }

.match-list { display:grid; gap:10px; }
.match { display:grid; grid-template-columns: 1fr auto 1fr auto; gap:12px; align-items:center; border:1px solid var(--line); border-radius:14px; padding:12px 13px; background:white; }
.match .home { text-align:right; font-weight:800; }
.match .away { text-align:left; font-weight:800; }
.score { min-width:74px; text-align:center; font-size:20px; font-weight:900; }
.match small { color:var(--muted); }
.round-block { margin-bottom:22px; }
.round-title { display:flex; align-items:center; gap:8px; margin-bottom:9px; font-weight:850; }

.leaderboard { display:grid; gap:9px; }
.leader-row { display:grid; grid-template-columns: 34px 1fr auto; align-items:center; gap:10px; padding:10px; border-radius:12px; background:#f7f8f4; }
.leader-row strong { display:block; }
.leader-row span { color:var(--muted); font-size:12px; }
.leader-value { font-size:20px; font-weight:900; }
.leader-value small { display:block; margin-top:2px; color:var(--muted); font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; }

.awards-panel { overflow:hidden; position:relative; margin-bottom:16px; padding:22px; border:0; background:linear-gradient(135deg,#13251a 0%,#24543a 68%,#326d4b 100%); color:white; }
.awards-panel::after { content:""; position:absolute; width:250px; height:250px; right:-105px; top:-125px; border-radius:50%; background:rgba(215,241,118,.17); }
.awards-head { position:relative; z-index:1; display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:16px; }
.awards-head h2 { margin:5px 0 4px; font-size:clamp(22px,4vw,32px); }
.awards-head p { margin:0; color:#c8d6cc; font-size:13px; }
.awards-head .kicker { color:#dff29c; }
.awards-status { display:inline-flex; align-items:center; gap:7px; flex:0 0 auto; padding:7px 10px; border:1px solid rgba(255,255,255,.2); border-radius:999px; background:rgba(255,255,255,.09); font-size:11px; font-weight:850; text-transform:uppercase; letter-spacing:.04em; }
.awards-grid { position:relative; z-index:1; display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; }
.award-card { min-width:0; padding:15px; border:1px solid rgba(255,255,255,.13); border-radius:16px; background:rgba(255,255,255,.09); backdrop-filter:blur(5px); }
.award-icon { display:grid; place-items:center; width:38px; height:38px; margin-bottom:11px; border-radius:12px; background:var(--brand-2); color:#162219; font-size:20px; }
.award-title { color:#c8d6cc; font-size:10px; font-weight:850; text-transform:uppercase; letter-spacing:.07em; }
.award-name { overflow-wrap:anywhere; margin-top:4px; font-size:17px; line-height:1.2; font-weight:900; }
.award-team { min-height:16px; margin-top:4px; color:#c8d6cc; font-size:11px; }
.award-value { margin-top:11px; color:var(--brand-2); font-size:12px; font-weight:850; }
.awards-method { position:relative; z-index:1; margin:13px 0 0; color:#bdcbc1; font-size:11px; line-height:1.45; }
.awards-actions { position:relative; z-index:1; display:flex; justify-content:flex-end; margin-top:14px; }
.awards-actions .ghost { color:white; border-color:#54745e; }

.modal-backdrop { position:fixed; inset:0; background:rgba(10,18,13,.55); display:grid; place-items:center; padding:20px; z-index:50; }
.modal-backdrop.hidden { display:none; }
.modal { width:min(680px, 100%); max-height:90vh; overflow:auto; background:var(--panel); border-radius:18px; box-shadow:0 24px 70px rgba(0,0,0,.2); padding:20px; }
.modal h2 { margin:0 0 16px; }
.modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; flex-wrap:wrap; }
.stats-editor { display:grid; gap:8px; margin-top:12px; }
.stats-player { display:grid; grid-template-columns:minmax(130px,1fr) repeat(5, 66px); gap:7px; align-items:end; border-top:1px solid var(--line); padding-top:9px; }
.stats-player label { display:grid; gap:3px; font-size:10px; color:var(--muted); font-weight:700; }
.stats-player input[type="number"] { width:100%; padding:7px; border:1px solid var(--line); border-radius:8px; }
.stats-player input[type="checkbox"] { width:18px; height:18px; }

.toast { position:fixed; right:20px; bottom:20px; background:#101b14; color:white; padding:11px 14px; border-radius:10px; opacity:0; transform:translateY(12px); pointer-events:none; transition:.2s; z-index:100; }
.toast.show { opacity:1; transform:translateY(0); }

.kicker { text-transform:uppercase; letter-spacing:.06em; font-size:11px; color:var(--muted); font-weight:850; }
.hero { background:linear-gradient(135deg, #173622, #2f6141); color:white; border:none; }
.hero p { color:#c8d7cd; max-width:700px; }
.hero .secondary { margin-top:8px; }
.note { font-size:12px; color:var(--muted); margin-top:8px; }

@media (max-width: 1050px) {
  .grid.cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .team-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
}

@media (max-width: 760px) {
  .app-shell { display:block; }
  .sidebar { position:fixed; left:-270px; width:250px; transition:.2s; }
  .sidebar.open { left:0; box-shadow: 20px 0 50px rgba(0,0,0,.2); }
  .menu-btn { display:block; }
  .topbar { padding:18px 16px 8px; }
  .topbar h1 { font-size:23px; }
  .content { padding:14px 16px 40px; }
  .grid.cols-4, .grid.cols-3, .grid.cols-2, .team-grid { grid-template-columns:1fr; }
  .form-grid { grid-template-columns:1fr; }
  .field.full { grid-column:auto; }
  .match { grid-template-columns:1fr auto 1fr; }
  .match .edit-match { grid-column:1/-1; width:100%; }
  .stats-player { grid-template-columns:1fr repeat(3, 1fr); }
  .stats-player label:nth-of-type(4), .stats-player label:nth-of-type(5) { grid-column:span 1; }
}

/* Copparì v1.2 — torneo in una notte */
.progress-track { height:10px; background:var(--panel-2); border-radius:999px; overflow:hidden; }
.progress-fill { height:100%; background:var(--brand); border-radius:999px; transition:.2s; }
.target-line { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; font-size:13px; }
.target-line strong { font-size:15px; }
.night-hero { background:#101b14; color:white; border:none; }
.night-hero .note { color:#b8c4ba; }
.next-match-card { padding:22px; text-align:center; }
.next-match-stage { text-transform:uppercase; letter-spacing:.08em; font-size:11px; color:var(--muted); font-weight:850; }
.next-match-teams { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px; margin:18px 0; }
.next-match-team { font-size:22px; font-weight:900; }
.next-match-vs { font-size:12px; color:var(--muted); font-weight:800; }
.quick-score { display:flex; align-items:center; justify-content:center; gap:8px; margin:14px 0; }
.quick-score input { width:72px; font-size:28px; font-weight:900; text-align:center; border:1px solid var(--line); border-radius:12px; padding:8px; }
.quick-score span { font-weight:900; }
.phase-badge { display:inline-flex; border-radius:999px; padding:6px 10px; font-size:11px; font-weight:850; background:#e7ede5; }
.phase-badge.ko { background:#f6e7c8; color:#704f0d; }
.qualified-row { display:grid; grid-template-columns:36px 1fr auto; gap:10px; align-items:center; padding:10px; border-radius:12px; background:#f7f8f4; }
.schedule-summary { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 16px; }
.status-chip { border-radius:999px; padding:6px 10px; font-size:12px; font-weight:750; background:var(--panel-2); }
.status-chip.done { background:#e4f2df; color:#285332; }
.status-chip.live { background:#f8edc9; color:#7d5b14; }
.bulk-area { width:100%; min-height:230px; border:1px solid var(--line); border-radius:12px; padding:12px; resize:vertical; font:inherit; }
.match .stage-label { grid-column:1/-1; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:850; }
.knockout-box { border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:14px; background:#fafbf8; }

@media (max-width:760px) {
  .next-match-teams { gap:8px; }
  .next-match-team { font-size:18px; }
  .quick-score input { width:64px; font-size:24px; }
  .target-line { align-items:flex-start; }
}

/* Copparì v1.3 — configurazione dinamica */
.app-shell.setup-mode { display:block; min-height:100vh; }
.app-shell.setup-mode .sidebar,
.app-shell.setup-mode .topbar { display:none !important; }
.app-shell.setup-mode .content { padding:24px 16px 56px; }
.setup-wrap { width:min(900px,100%); margin:0 auto; }
.setup-brand { display:flex; align-items:center; gap:16px; margin:18px 0 20px; }
.setup-brand h1 { margin:2px 0 5px; font-size:32px; }
.setup-brand p { margin:0; color:var(--muted); }
.brand-mark.large { width:82px; height:82px; }
.setup-card { padding:22px; }
.setup-preview { margin-top:18px; padding:14px; border-radius:14px; background:#f7f8f4; border:1px solid var(--line); }
.setup-preview-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.setup-preview-grid div { background:white; border:1px solid var(--line); border-radius:11px; padding:11px; }
.setup-preview-grid span { display:block; color:var(--muted); font-size:11px; font-weight:750; margin-bottom:4px; }
.setup-preview-grid strong { font-size:15px; }
.setup-start { width:100%; padding:13px 16px; margin-top:14px; font-size:16px; }
@media (max-width:760px) {
  .setup-brand { align-items:flex-start; }
  .setup-brand h1 { font-size:26px; }
  .setup-preview-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .setup-card { padding:16px; }
}

/* Copparì v2.2 DEFINITIVA — torneo configurabile + modalità arbitro completa */
.match-actions { display:flex; gap:7px; }
.referee-launch { font-size:15px; padding:12px 16px; }
.modal-backdrop.referee-mode { align-items:stretch; padding:10px; }
.referee-modal { width:min(1100px,100%); max-height:calc(100vh - 20px); padding:16px; }
.ref-head { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; position:sticky; top:-16px; background:var(--panel); padding:12px 0; z-index:4; border-bottom:1px solid var(--line); }
.ref-stage { text-align:center; font-size:12px; font-weight:850; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
.ref-scoreboard { display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:center; text-align:center; margin:18px 0 6px; }
.ref-scoreboard div { font-size:18px; font-weight:900; }
.ref-scoreboard strong { font-size:42px; white-space:nowrap; }
.ref-timer { display:grid; place-items:center; margin:6px 0 12px; }
.ref-timer span { font-variant-numeric:tabular-nums; font-size:36px; font-weight:950; line-height:1; }
.ref-timer small { color:var(--muted); margin-top:5px; font-weight:800; }
.ref-phase-actions { display:flex; justify-content:center; gap:8px; margin-bottom:16px; }
.ref-layout { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.ref-team { border:1px solid var(--line); border-radius:16px; overflow:hidden; background:#fafbf8; }
.ref-team-title { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:#101b14; color:white; }
.ref-team-title span { font-weight:900; }
.ref-team-title strong { font-size:22px; }
.ref-team-goal { margin:9px; width:calc(100% - 18px); }
.ref-roster { display:grid; gap:1px; padding:0 9px 9px; }
.ref-player { display:grid; grid-template-columns:minmax(0,1fr) repeat(4,42px); gap:5px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
.ref-player:first-child { border-top:0; }
.ref-player .grow { min-width:0; }
.ref-player strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ref-player span { display:block; color:var(--muted); font-size:10px; }
.ref-player button { width:40px; height:38px; border:1px solid var(--line); background:white; border-radius:10px; padding:0; font-size:17px; }
.ref-player button:active { transform:scale(.95); background:var(--panel-2); }
.ref-bottom-grid { display:grid; grid-template-columns:1.2fr .8fr; gap:12px; margin-top:12px; }
.ref-log-card { min-height:220px; }
.ref-events { display:grid; gap:6px; max-height:330px; overflow:auto; }
.ref-event { display:grid; grid-template-columns:48px 1fr auto; gap:8px; align-items:center; padding:8px; background:#f7f8f4; border-radius:10px; }
.ref-event small { display:block; color:var(--muted); margin-top:2px; }
.ref-minute { font-weight:950; text-align:center; }
.ref-pens { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
.ref-pens label { display:grid; gap:5px; font-size:11px; font-weight:800; color:var(--muted); }
.ref-pens input { width:100%; border:1px solid var(--line); border-radius:9px; padding:9px; }
.empty.compact { padding:20px 12px; }

@media (max-width:760px) {
  .modal-backdrop.referee-mode { padding:0; }
  .referee-modal { width:100%; max-height:100vh; min-height:100vh; border-radius:0; padding:12px; }
  .ref-head { top:-12px; padding:10px 0; }
  .ref-head .ghost { padding:8px 9px; }
  .ref-scoreboard { gap:7px; margin-top:12px; }
  .ref-scoreboard div { font-size:14px; }
  .ref-scoreboard strong { font-size:34px; }
  .ref-timer span { font-size:31px; }
  .ref-layout, .ref-bottom-grid { grid-template-columns:1fr; }
  .ref-player { grid-template-columns:minmax(0,1fr) repeat(4,39px); gap:4px; }
  .ref-player button { width:37px; height:36px; }
  .match-actions { grid-column:1/-1; width:100%; }
  .match-actions button { flex:1; }
}

/* Copparì v3.0 — cabina di regia */
:root {
  --bg: #f3f5ef;
  --panel: #fffefa;
  --panel-2: #edf1e8;
  --ink: #142119;
  --muted: #68736b;
  --line: #dbe2d8;
  --brand: #24543a;
  --brand-dark: #13251a;
  --brand-2: #d7f176;
  --danger: #a93737;
  --warn: #9b6914;
  --info: #285d7b;
  --shadow: 0 14px 40px rgba(22, 44, 30, .08);
  --shadow-strong: 0 24px 70px rgba(12, 30, 19, .18);
  --radius: 20px;
}

html { scroll-behavior:smooth; }
body { background:
  radial-gradient(circle at 82% -8%, rgba(215,241,118,.28), transparent 30rem),
  radial-gradient(circle at 15% 110%, rgba(36,84,58,.09), transparent 34rem),

function rosterCompatibility(total, rosterSize){
  total=Math.floor(Number(total)||0);
  rosterSize=Math.max(5,Math.floor(Number(rosterSize)||5));
  const teams = total>=10 && total%rosterSize===0 ? total/rosterSize : 0;
  const valid = Number.isInteger(teams) && teams>=2;
  const lowerTeams=Math.floor(total/rosterSize);
  const upperTeams=Math.max(2,Math.ceil(total/rosterSize));
  const lowerTotal=lowerTeams>=2 ? lowerTeams*rosterSize : null;
  const upperTotal=upperTeams*rosterSize;
  const rosterOptions=[];
  for(let size=5;size<=20;size++) if(total%size===0 && total/size>=2) rosterOptions.push({rosterSize:size,teams:total/size});
  return {valid,teams:valid?teams:0,total,rosterSize,lowerTotal,upperTotal,rosterOptions};
}
function calcTeamCount(total, rosterSize){ return rosterCompatibility(total,rosterSize).teams; }
function rosterDistribution(total=state.settings.targetPlayers, teamCount=state.settings.teamCount){
  total=Math.max(0,Math.floor(Number(total)||0)); teamCount=Math.max(0,Math.floor(Number(teamCount)||0));
  if(!teamCount || total%teamCount!==0) return [];
  return Array(teamCount).fill(total/teamCount);
}

function knockoutBracketSize(teamCount=state.settings.teamCount, settings=state.settings){
  if((!settings.playoffs && settings.tournamentFormat!=='knockout') || teamCount<2) return 0;
  let size=1;
  while(size*2<=teamCount) size*=2;
  return Math.max(2,size);
}
function qualifiedCount(){ return knockoutBracketSize(); }
function knockoutGamesExpected(teamCount=state.settings.teamCount, settings=state.settings){
  const size=knockoutBracketSize(teamCount,settings);

  return (size-1) + (settings.bronzeFinal && size>=4 ? 1 : 0);
}
function totalGamesExpected(settings=state.settings){

function playoffText(settings=state.settings){

  return `${knockoutRoundName(size).toLowerCase()} per le prime ${size} + finale${settings.bronzeFinal?' + 3° posto':''}`;
}
function stageLabel(m){
  if(m.stage==='bronze') return 'Finale 3° posto';
  if(m.stage==='prelim') return 'Turno preliminare';
  if(isKnockoutMatch(m)){
    const size=m.koSize || ({final:2,semi:4,quarter:8,round16:16,round32:32}[m.stage]);
    return size?knockoutMatchLabel(size,m.slot):'Fase finale';
  }
  const leg = legsCount()===2 ? (m.leg===2?' · Ritorno':' · Andata') : '';
  const slot=groupMatches().findIndex(x=>x.id===m.id)+1;
  return `Partita ${Math.max(1,slot)}${leg}`;

function matchOperationalMinutes(settings=state.settings){ return Math.max(0,+settings.matchMinutes||0)+Math.max(0,+settings.halftimeMinutes||0); }
function estimatedTournamentMinutes(settings=state.settings){
  const games=totalGamesExpected(settings);
  return games*matchOperationalMinutes(settings)+Math.max(0,games-1)*Math.max(0,+settings.changeMinutes||0);

function bracketSeedOrder(size){
  if(size<2) return [];
  let order=[1,2];
  while(order.length<size){
    const sum=order.length*2+1;
    order=order.flatMap(seed=>[seed,sum-seed]);
  }
  return order;
}

function persistStateLocally(){

}
function save(options={}){
  if(liveRole==='viewer')return true;
  state.meta={...(state.meta||{}),appVersion:APP_VERSION,updatedAt:new Date().toISOString()};
  if(liveRole==='manager'){
    if(liveApplyingRemote)return true;
    if(!liveConnected||liveEnded){toast(liveEnded?'La diretta è terminata':'Collegamento live interrotto: attendi la riconnessione',4200);return false;}
    sendLiveManagerUpdate();updateSaveIndicator();return true;
  }
  if(liveRole==='referee'){
    if(liveApplyingRemote)return true;
    if(!liveConnected||liveEnded){toast(liveEnded?'La diretta è terminata':'Collegamento arbitrale interrotto: attendi la riconnessione',4200);return false;}
    const matchId=options.matchId||activeRefereeMatchId;if(!matchId){toast('Il link arbitro può modificare soltanto un referto',4200);return false;}
    sendLiveRefereeMatchUpdate(matchId);updateSaveIndicator();return true;
  }
  if(!storageReady){toast('Salvataggio non disponibile: apri l’app in Safari',4200);return false;}
  try{
    if(!persistStateLocally())throw new Error('storage');
    if(liveRole==='host'&&!liveApplyingRemote)sendLiveManagerUpdate();
    updateSaveIndicator();return true;
  }catch(error){toast('Spazio esaurito: esporta subito un backup');return false;}
}

    const history=historyEntries();
    history.unshift({id:uid('snap'),label,createdAt:new Date().toISOString(),state:JSON.parse(JSON.stringify(state))});
    return storageSet(HISTORY_KEY,JSON.stringify(history.slice(0,12)));

function latestSnapshot(){return historyEntries()[0]||null;}
function restoreLastSnapshot(){
  const snap=latestSnapshot();if(!snap)return toast('Nessuna modifica da ripristinare');

  createSnapshot('Prima del ripristino');
  const restored=normalizeState(snap.state);Object.keys(state).forEach(k=>delete state[k]);Object.assign(state,restored);
  const history=historyEntries().filter(x=>x.id!==snap.id);storageSet(HISTORY_KEY,JSON.stringify(history));

}

  if((['viewer','manager','referee'].includes(liveRole)&&liveConnecting&&!liveHasState)||(['manager','referee'].includes(liveRole)&&!liveConnected)){renderLiveWaiting();return;}

    setSetupMode(false);
    if(!['home','calendar','standings','stats'].includes(currentView))currentView='home';
    const spectatorRenders={home:renderSpectatorHome,calendar:renderSpectatorCalendar,standings:renderStandings,stats:renderStats};
    (spectatorRenders[currentView]||renderSpectatorHome)();updateLiveStatusUI();return;
  }
  if(liveRole==='referee'){
    setSetupMode(false);
    if(!['home','calendar','standings','stats'].includes(currentView))currentView='home';
    const refereeRenders={home:renderRemoteRefereeHome,calendar:renderRemoteRefereeHome,standings:renderStandings,stats:renderStats};
    (refereeRenders[currentView]||renderRemoteRefereeHome)();updateLiveStatusUI();return;
  }
  if(!state.settings.configured){ renderSetup(); return; }
  setSetupMode(false);
  const renders={home:renderHome,dashboard:renderHome,night:renderHome,players:renderPlayers,teams:renderTeams,calendar:renderCalendar,standings:renderStandings,stats:renderStats,settings:renderSettings};
  (renders[currentView]||renderHome)();updateLiveStatusUI();
}
function metric(label,value,sub=''){ return `<div class="card"><div class="metric-label">${label}</div><div class="metric">${value}</div>${sub?`<div class="note">${sub}</div>`:''}</div>`; }

function cleanLiveRoomId(value){const text=String(value||'').trim();return /^coppari-[a-z0-9_-]{20,80}$/i.test(text)?text:null;}
function cleanLiveSecret(value){const text=String(value||'').trim();return /^[a-z0-9_-]{20,120}$/i.test(text)?text:null;}
function randomLiveToken(bytes=18){
  const data=new Uint8Array(bytes);crypto.getRandomValues(data);
  return btoa(String.fromCharCode(...data)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function readLiveHostConfig(){
  try{const raw=JSON.parse(storageGet(LIVE_CONFIG_KEY)||'null');const roomId=cleanLiveRoomId(raw?.roomId),secret=cleanLiveSecret(raw?.secret),refereeSecret=cleanLiveSecret(raw?.refereeSecret);return roomId&&secret&&refereeSecret&&raw?.active?{roomId,secret,refereeSecret,transportVersion:+raw.transportVersion||1,active:true}:null;}catch{return null;}
}

function sharedStateSnapshot(){return JSON.parse(JSON.stringify(state));}
function loadLiveLibrary(){

  liveLibraryPromise=new Promise((resolve,reject)=>{
    const script=document.createElement('script');script.src=SUPABASE_JS_URL;script.integrity=SUPABASE_JS_INTEGRITY;script.crossOrigin='anonymous';script.referrerPolicy='no-referrer';
    script.onload=()=>window.supabase?.createClient?resolve(window.supabase):reject(new Error('Supabase non disponibile'));
    script.onerror=()=>reject(new Error('Impossibile caricare Supabase'));
    document.head.appendChild(script);

}
async function getLiveClient(){
  if(liveSupabaseClient)return liveSupabaseClient;
  const library=await loadLiveLibrary();
  liveSupabaseClient=library.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},realtime:{params:{eventsPerSecond:10}}});
  return liveSupabaseClient;
}
async function liveRpc(name,args){
  const client=await getLiveClient(),{data,error}=await client.rpc(name,args);
  if(error)throw error;

}
function liveErrorText(error){
  const text=String(error?.message||error||'');
  if(error?.code==='PGRST202'||/schema cache|could not find the function/i.test(text))return 'Supabase non è ancora configurato: esegui lo script coppari_live.sql nel SQL Editor.';
  if(error?.code==='42883'&&/digest/i.test(text))return 'Database Live da aggiornare: esegui fix_pgcrypto_schema.sql nel SQL Editor di Supabase.';
  if(/LIVE_ROOM_INVALID/i.test(text))return 'Identificativo Live non valido. Riprova: Copparì ne creerà automaticamente uno nuovo.';
  if(/LIVE_ROOM_NOT_FOUND/i.test(text))return 'Questa diretta non esiste o il link non è valido.';
  if(/LIVE_ACCESS_DENIED|LIVE_SECRET_INVALID/i.test(text))return 'Il link gestore o arbitro non è valido.';
  if(/LIVE_ENDED/i.test(text))return 'La diretta è stata terminata dal gestore.';
  if(/LIVE_ROOM_TAKEN/i.test(text))return 'Impossibile creare la stanza Live. Riprova per generarne una nuova.';
  if(/failed to fetch|network|timeout/i.test(text))return 'Supabase non è raggiungibile. Controlla la connessione Internet.';
  return 'Servizio Live temporaneamente non disponibile.';
}
function closeLiveTransport(){

  const channel=liveChannel;liveChannel=null;if(channel&&liveSupabaseClient)liveSupabaseClient.removeChannel(channel).catch(()=>{});
  liveConnected=false;livePresenceCount=0;syncScreenWakeLock();
}
function hostConnectionCount(){return livePresenceCount;}

function refreshAfterLiveState(){
  if(activeRefereeMatchId&&['manager','referee'].includes(liveRole)&&state.matches.some(m=>m.id===activeRefereeMatchId))renderRefereeMode(activeRefereeMatchId);else render();
}
function applyLiveClientState(raw,revision,force=false){
  try{
    if(JSON.stringify(raw).length>2000000)throw new Error('too-large');
    if(!force&&Number.isFinite(+revision)&&+revision<=liveRevision&&liveHasState)return;
    const clean=normalizeState(raw),first=!liveHasState;liveApplyingRemote=true;
    Object.keys(state).forEach(key=>delete state[key]);Object.assign(state,clean);liveRevision=Math.max(0,+revision||0);liveHasState=true;liveConnecting=false;liveErrorMessage='';
    if(liveRole==='host')persistStateLocally();if(first){currentView='home';sessionSet('coppari.currentView','home');}
    refreshAfterLiveState();liveApplyingRemote=false;updateLiveStatusUI();
  }catch{liveApplyingRemote=false;toast('Dati live non validi',4200);}
}
function applyLiveRow(row,force=false){
  if(!row?.state)throw new Error('LIVE_ROOM_NOT_FOUND');
  liveEnded=row.active===false;liveConnected=true;applyLiveClientState(row.state,row.revision,force);
}
async function fetchLiveState(force=false){
  const row=await liveRpc('coppari_live_read',{p_room_id:liveRoomId});applyLiveRow(row,force);return row;
}
function updateLivePresence(){
  if(!liveChannel)return;const total=Object.values(liveChannel.presenceState()||{}).reduce((sum,entries)=>sum+(Array.isArray(entries)?entries.length:0),0);
  livePresenceCount=Math.max(0,total-(liveRole==='host'?1:0));updateLiveStatusUI();
}
function notifyLiveRefresh(){
  if(!liveChannel||!liveConnected)return;
  liveChannel.send({type:'broadcast',event:'refresh',payload:{revision:liveRevision}}).catch(()=>{});
}
async function connectLiveChannel({fetchState=true}={}){
  const client=await getLiveClient();closeLiveTransport();const generation=liveTransportGeneration;
  return await new Promise((resolve,reject)=>{
    let settled=false;const channel=client.channel(`coppari-live:${liveRoomId}`,{config:{broadcast:{self:false},presence:{key:randomLiveToken(9)},private:false}});liveChannel=channel;
    const finishError=error=>{if(settled)return;settled=true;reject(error instanceof Error?error:new Error(String(error||'LIVE_CHANNEL_ERROR')));};
    const timer=setTimeout(()=>finishError(new Error('LIVE_CHANNEL_TIMEOUT')),12000);
    channel.on('broadcast',{event:'refresh'},payload=>{if(generation!==liveTransportGeneration||liveChannel!==channel)return;const revision=+payload?.payload?.revision||0;if(revision>liveRevision)fetchLiveState(true).catch(handleLiveConnectionError);});
    channel.on('presence',{event:'sync'},()=>{if(generation===liveTransportGeneration&&liveChannel===channel)updateLivePresence();});
    channel.subscribe(async status=>{
      if(generation!==liveTransportGeneration||liveChannel!==channel)return;
      if(status==='SUBSCRIBED'){
        try{liveConnected=true;liveConnecting=false;liveReconnectAttempts=0;await channel.track({role:liveRole,onlineAt:new Date().toISOString()});if(fetchState)await fetchLiveState(true);updateLivePresence();clearTimeout(timer);if(!settled){settled=true;resolve(true);}}
        catch(error){clearTimeout(timer);finishError(error);}

        liveConnected=false;updateLiveStatusUI();clearTimeout(timer);finishError(new Error(status));
      }
    });
  });
}
function handleLiveConnectionError(error){

}
async function startLiveHost({resume=false}={}){
  if(liveRole&&liveRole!=='host')return false;
  let config=readLiveHostConfig();
  if(config&&config.transportVersion!==3)config={roomId:null,secret:config.secret,refereeSecret:config.refereeSecret,transportVersion:3,active:true};
  if(!config)config={roomId:null,secret:randomLiveToken(24),refereeSecret:randomLiveToken(24),transportVersion:3,active:true};
  if(!LIVE_ROOM_ID_PATTERN.test(config.roomId||''))config.roomId=`coppari-${randomLiveToken(24)}`;
  liveRole='host';liveRoomId=config.roomId;liveSecret=config.secret;liveRefereeSecret=config.refereeSecret;liveConnecting=true;liveEnded=false;liveErrorMessage='';updateLiveStatusUI();
  try{
    const row=await liveRpc('coppari_live_create',{p_room_id:liveRoomId,p_manager_secret:liveSecret,p_referee_secret:liveRefereeSecret,p_state:sharedStateSnapshot()});
    applyLiveRow(row,true);writeLiveHostConfig(config);await connectLiveChannel({fetchState:true});return true;
  }catch(error){liveConnecting=false;liveErrorMessage=liveErrorText(error);if(!resume)toast(liveErrorMessage,5200);updateLiveStatusUI();return false;}

function scheduleLiveReconnect(delay){
  clearTimeout(liveReconnectTimer);if(!liveRoomId||liveEnded)return;
  const attempt=liveReconnectAttempts++,wait=Number.isFinite(delay)?delay:Math.min(12000,1800*(2**Math.min(attempt,3)));
  liveReconnectTimer=setTimeout(()=>connectToLiveHost(),wait);
}
async function connectToLiveHost(){

function queueLiveWrite(task){

function handleLiveWriteResult(row,conflictMessage){

function setupPreviewValues(){
  const name=(document.getElementById('setupName')?.value||'Copparì').trim().slice(0,80)||'Copparì';
  const edition=(document.getElementById('setupEdition')?.value||'Edizione 2026').trim().slice(0,80)||'Edizione 2026';
  const venue=(document.getElementById('setupVenue')?.value||'').trim().slice(0,120);
  const organizer=(document.getElementById('setupOrganizer')?.value||'').trim().slice(0,120);
  const total=clamp(+document.getElementById('setupPlayers')?.value||25,10,200);
  const roster=clamp(+document.getElementById('setupRoster')?.value||5,5,20);
  const mode=document.getElementById('setupMode')?.value||'single';
  const tournamentFormat=document.getElementById('setupFormat')?.value||'groups_ko';
  const playoffs=tournamentFormat!=='league';
  const minutes=clamp(+document.getElementById('setupMinutes')?.value||20,2,120);
  const halftime=clamp(numOr(document.getElementById('setupHalftime')?.value,2),0,30);
  const change=clamp(numOr(document.getElementById('setupChange')?.value,4),0,60);
  const compatibility=rosterCompatibility(total,roster);
  const teams=compatibility.teams;
  const sizes=rosterDistribution(total,teams);
  const startTime='00:00';
  const periods=2;
  const settings={targetPlayers:total,rosterSize:roster,teamCount:teams,scheduleMode:mode,tournamentFormat,playoffs,bronzeFinal:false,startTime,periods,matchMinutes:minutes,halftimeMinutes:halftime,changeMinutes:change};
  const bracket=knockoutBracketSize(teams,settings);
  const bronzeRequested=document.getElementById('setupBronze')?.value==='1';
  const bronze=playoffs && bracket>=4 && bronzeRequested;
  settings.bronzeFinal=bronze;
  const group=groupGamesExpected(teams,settings);
  const ko=knockoutGamesExpected(teams,settings);
  const games=group+ko;
  const totalMinutes=estimatedTournamentMinutes(settings);
  const koText=!playoffs?'Nessun playoff':bracket===2?'Finale 1ª vs 2ª':`${knockoutRoundName(bracket)} (prime ${bracket}) + finale${bronze?' + 3° posto':''}`;
  return {name,edition,venue,organizer,total,roster,mode,tournamentFormat,playoffs,bronze,startTime,periods,minutes,halftime,change,teams,sizes,group,ko,koText,games,totalMinutes,bracket,valid:compatibility.valid,compatibility};
}
function humanDuration(minutes){
  minutes=Math.max(0,Math.round(minutes));
  const h=Math.floor(minutes/60),m=minutes%60;
  return h?`${h}h ${String(m).padStart(2,'0')}m`:`${m} min`;
}

  }

    const totalHint=totals.length?`Con rose da <strong>${p.roster}</strong>, usa ${totals.map(v=>`<strong>${v} partecipanti</strong> (${v/p.roster} squadre)`).join(' oppure ')}.`:'';

function tournamentStatus(){
  const count=activePlayers().length, target=state.settings.targetPlayers, expectedGroup=groupGamesExpected();
  if(count!==target) return `<p class="note">Hai ${count}/${target} partecipanti attivi. ${count<target?`Ne mancano ${target-count}.`:`Sono ${count-target} in più rispetto alla configurazione.`}</p>`;
  if(state.teams.length!==state.settings.teamCount) return `<p class="note">Partecipanti pronti. Genera le ${state.settings.teamCount} squadre equilibrate.</p>`;
  if(groupMatches().length!==expectedGroup) return `<p class="note">Squadre pronte. Genera il calendario (${expectedGroup} partite di girone).</p>`;
  if(playedMatches('group').length<expectedGroup) return `<p class="note">Girone in corso: ${playedMatches('group').length}/${expectedGroup} partite completate.</p>`;
  if(!state.settings.playoffs) return `<p class="note"><strong>Girone completato.</strong> La prima in classifica vince ${esc(state.settings.name)}.</p>`;
  const bracket=knockoutBracketSize();
  const kos=knockoutMatches();
  if(!kos.length) return `<p class="note">Girone terminato: crea ${knockoutRoundName(bracket).toLowerCase()} per le prime ${bracket}.</p>`;
  const final=state.matches.find(m=>m.stage==='final');
  if(final?.status==='played') return `<p class="note"><strong>${esc(state.settings.name)} completato.</strong> La finalissima è stata giocata.</p>`;
  const next=kos.find(m=>m.status!=='played');
  if(next) return `<p class="note">Fase finale in corso: <strong>${stageLabel(next)}</strong>.</p>`;
  return '<p class="note">Fase finale pronta per il turno successivo.</p>';
}

    <div class="control-grid">
      <div class="card soft"><div class="kicker">Prossimo passo consigliato</div><div class="next-action" style="margin-top:12px"><span class="next-action-icon">${action.icon}</span><div><strong>${esc(action.title)}</strong><p>${esc(action.text)}</p></div><button class="primary" id="nextActionBtn">${esc(action.label)}</button></div>${snap?`<div class="notice info" style="margin-top:14px"><span>↶</span><span><strong>Rete di sicurezza attiva.</strong> Ultimo punto di ripristino: ${esc(snap.label)}.</span><button class="ghost" id="quickUndo">Ripristina</button></div>`:''}</div>

      <div class="card"><h3>Fase finale</h3>${renderKnockoutSummary()}${state.settings.playoffs?'<div style="margin-top:12px"><button class="ghost full" id="syncKo">Aggiorna fase finale</button></div>':''}</div>

  document.getElementById('openReferee')?.addEventListener('click',()=>openRefereeMode(next.id));

function renderNextMatchCard(m){
  const h=teamById(m.homeTeamId), a=teamById(m.awayTeamId);
  const live=m.status==='live';
  const score=(m.homeScore??0)+' — '+(m.awayScore??0);
  return `<div class="card next-match-card" style="margin-top:16px"><div class="next-match-stage">${live?'● PARTITA IN CORSO':'PROSSIMA PARTITA'} · ${stageLabel(m)}</div><div class="next-match-teams"><div class="next-match-team">${esc(h?.name||'?')}</div><div class="next-match-vs">${live?`<strong style="font-size:24px">${score}</strong>`:'VS'}</div><div class="next-match-team">${esc(a?.name||'?')}</div></div><div class="button-row center"><button class="primary referee-launch" id="openReferee">${live?'Riprendi arbitraggio':'Avvia arbitraggio'}</button><button class="ghost" id="openSheet">Gestisci tabellino</button></div><div class="inline-meta" style="justify-content:center"><span class="status-chip">${state.settings.matchMinutes} min gioco</span><span class="status-chip">${state.settings.halftimeMinutes} min intervallo</span><span class="status-chip">${state.settings.touchGuard?'🔒 Anti-tocco attivo':'Anti-tocco disattivato'}</span></div></div>`;
}
function quickSave(id){
  const m=state.matches.find(x=>x.id===id); if(!m)return;
  const hs=document.getElementById('quickHome').value, as=document.getElementById('quickAway').value;
  if(hs===''||as==='')return toast('Inserisci entrambi i risultati');
  if(m.stage!=='group' && +hs===+as){ toast('Nei playoff indica anche i rigori nel tabellino completo'); openMatchModal(id); return; }
  m.homeScore=+hs; m.awayScore=+as; m.status='played'; m.stats=m.stats||[]; save(); syncKnockout(false); renderHome(); toast('Risultato salvato');
}
function renderKnockoutSummary(){
  if(!state.settings.playoffs) return `<p class="note">Playoff disattivati: al termine del ${formatMode()} vince la prima in classifica.</p>`;
  const kos=knockoutMatches();
  const bracket=knockoutBracketSize();
  if(!kos.length){
    return `<p class="note">La fase finale viene creata automaticamente quando tutte le ${groupGamesExpected()} partite del girone sono concluse: si qualificano le prime <strong>${bracket}</strong> e si parte dai <strong>${knockoutRoundName(bracket).toLowerCase()}</strong>.</p>`;
  }
  return `<div class="match-list">${kos.map(m=>{const h=teamById(m.homeTeamId),a=teamById(m.awayTeamId);return `<div class="roster-row"><span class="phase-badge ko">${stageLabel(m)}</span><span class="grow"><strong>${esc(h?.name||'?')}</strong> vs <strong>${esc(a?.name||'?')}</strong></span><span>${m.status==='played'?`${m.homeScore}-${m.awayScore}`:'—'}</span></div>`}).join('')}</div>`;
}

function renderPlayers(){
  setHeader('Partecipanti',`${state.settings.name} · previsti ${state.settings.targetPlayers}`);

  const count=activePlayers().length;
  view.innerHTML=`
    <div class="section-head"><h2>Partecipanti <span class="badge ${count===state.settings.targetPlayers?'green':count>state.settings.targetPlayers?'red':'yellow'}">${count}/${state.settings.targetPlayers}</span></h2><div class="actions"><button class="secondary" id="bulkPlayers">Incolla lista</button><button class="primary" id="addPlayerBtn">+ Aggiungi</button></div></div>
    ${count!==state.settings.targetPlayers?`<div class="notice ${count>state.settings.targetPlayers?'danger':'warn'}" style="margin-bottom:14px"><span>${count>state.settings.targetPlayers?'!':'i'}</span><span>${count<state.settings.targetPlayers?`Mancano <strong>${state.settings.targetPlayers-count}</strong> partecipanti attivi prima di generare le squadre.`:`Ci sono <strong>${count-state.settings.targetPlayers}</strong> partecipanti attivi in più rispetto alla configurazione. Puoi disattivarli o aggiornare le impostazioni.`}</span></div>`:''}
    ${rows?`<div class="search-row"><label class="sr-only" for="playerSearch">Cerca partecipante</label><input id="playerSearch" type="search" placeholder="Cerca nome, ruolo o squadra…" autocomplete="off"><button class="ghost" id="clearPlayerSearch">Azzera filtro</button></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Ruolo</th><th>Livello</th><th>Squadra</th><th>Stato</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><div class="note" id="playerSearchCount" style="margin-top:9px">${state.players.length} partecipanti visualizzati</div>`:`<div class="empty"><strong>Nessun partecipante inserito</strong>Usa “Incolla lista” per aggiungere rapidamente tutti i ${state.settings.targetPlayers} partecipanti, un nome per riga.<br><br><button class="secondary" id="emptyBulk">Incolla lista partecipanti</button></div>`}
  `;
  document.getElementById('addPlayerBtn')?.addEventListener('click',()=>openPlayerModal());
  document.getElementById('bulkPlayers')?.addEventListener('click',openBulkPlayersModal);
  document.getElementById('emptyBulk')?.addEventListener('click',openBulkPlayersModal);
  view.querySelectorAll('[data-edit-player]').forEach(b=>b.onclick=()=>openPlayerModal(b.dataset.editPlayer));
  const search=document.getElementById('playerSearch');
  const filterPlayers=()=>{const q=(search?.value||'').trim().toLowerCase();let visible=0;view.querySelectorAll('[data-player-row]').forEach(row=>{const show=!q||row.dataset.search.includes(q);row.hidden=!show;if(show)visible++;});const countEl=document.getElementById('playerSearchCount');if(countEl)countEl.textContent=`${visible} partecipanti visualizzati`;};
  search?.addEventListener('input',filterPlayers);document.getElementById('clearPlayerSearch')?.addEventListener('click',()=>{search.value='';filterPlayers();search.focus();});
}
function openBulkPlayersModal(){
  openModal(`<h2>Incolla partecipanti</h2><p class="modal-subtitle">Un nome per riga. Facoltativo: <strong>Nome; Ruolo; Livello</strong> (es. Luca; ATT; 4).</p><textarea class="bulk-area" id="bulkNames" placeholder="Luca; ATT; 4\nMarco; POR; 3\nAndrea"></textarea><div class="notice info" style="margin-top:10px"><span>i</span><span>I nomi già presenti vengono ignorati. Ruolo predefinito: Da definire; livello: 3.</span></div><div class="modal-actions"><button class="ghost" data-close>Annulla</button><button class="primary" id="saveBulk">Aggiungi lista</button></div>`);
  document.getElementById('saveBulk').onclick=()=>{
    const rows=document.getElementById('bulkNames').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);
    if(!rows.length)return toast('Incolla almeno un nome');
    const roleMap={'DA DEFINIRE':'TBD',TBD:'TBD',PORTIERE:'POR',POR:'POR',DIFENSORE:'DIF',DIF:'DIF',CENTROCAMPISTA:'CEN',CEN:'CEN',ATTACCANTE:'ATT',ATT:'ATT'};
    const existing=new Set(state.players.map(p=>p.name.toLowerCase())); let added=0;
    createSnapshot('Prima dell’importazione partecipanti');
    rows.forEach(row=>{const [rawName,rawRole='',rawRating='']=row.split(/[;\t]/).map(x=>x.trim());const name=rawName?.slice(0,80);if(name&&!existing.has(name.toLowerCase())){state.players.push({id:uid('p'),name,role:roleMap[rawRole.toUpperCase()]||'TBD',rating:clamp(+rawRating||3,1,5),teamId:null,active:true});existing.add(name.toLowerCase());added++;}});
    save();closeModal();renderPlayers();toast(`${added} partecipanti aggiunti`);
  };
}
function openPlayerModal(id=null){
  const p=id?playerById(id):{name:'',role:'TBD',rating:3,teamId:null,active:true};
  openModal(`<h2>${id?'Modifica':'Nuovo'} giocatore</h2><div class="form-grid"><div class="field full"><label>Nome</label><input id="pName" value="${esc(p.name)}" placeholder="Nome o soprannome"></div><div class="field"><label>Ruolo</label><select id="pRole">${['TBD','POR','DIF','CEN','ATT'].map(r=>`<option ${p.role===r?'selected':''} value="${r}">${roleLabel(r)}</option>`).join('')}</select></div><div class="field"><label>Livello (1-5)</label><select id="pRating">${[1,2,3,4,5].map(n=>`<option ${p.rating===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Stato</label><select id="pActive"><option value="1" ${p.active!==false?'selected':''}>Attivo</option><option value="0" ${p.active===false?'selected':''}>Non attivo</option></select></div></div>${p.teamId?`<p class="note">Squadra attuale: <strong>${esc(teamById(p.teamId)?.name||'—')}</strong>. Per cambiare squadra usa “Scambia giocatori”, così le rose restano sempre uguali.</p>`:''}<div class="modal-actions">${id?'<button class="danger" id="deletePlayer">Elimina</button>':''}<button class="ghost" data-close>Chiudi</button><button class="primary" id="savePlayer">Salva</button></div>`);
  document.getElementById('savePlayer').onclick=()=>{ const name=document.getElementById('pName').value.trim();if(!name)return toast('Inserisci il nome');if(state.players.some(x=>x.id!==id&&x.name.trim().toLowerCase()===name.toLowerCase()))return toast('Esiste già un partecipante con questo nome'); const active=document.getElementById('pActive').value==='1'; if(id&&p.teamId&&!active&&!confirm('Disattivandolo la sua rosa risulterà incompleta. Continuare?'))return; const data={name:name.slice(0,80),role:document.getElementById('pRole').value,rating:+document.getElementById('pRating').value,active};createSnapshot(id?`Prima della modifica di ${p.name}`:'Prima di aggiungere un partecipante'); if(id)Object.assign(p,data);else state.players.push({id:uid('p'),teamId:null,...data});save();closeModal();renderPlayers();toast('Partecipante salvato'); };
  document.getElementById('deletePlayer')?.addEventListener('click',()=>{if(!confirm(p.teamId?'Eliminare questo partecipante? La squadra resterà incompleta finché non rigeneri le rose o inserisci un sostituto.':'Eliminare questo partecipante?'))return;createSnapshot(`Prima di eliminare ${p.name}`);state.teams.forEach(t=>{if(t.captainId===id)t.captainId=null;});state.players=state.players.filter(x=>x.id!==id);state.matches.forEach(m=>{m.stats=(m.stats||[]).filter(s=>s.playerId!==id);m.events=(m.events||[]).filter(e=>e.playerId!==id);m.ratings=(m.ratings||[]).filter(r=>r.playerId!==id);if(m.mvpPlayerId===id)m.mvpPlayerId=null;});save();closeModal();renderPlayers();toast('Partecipante eliminato');});
}

function renderTeams(){
  const expected=state.settings.rosterSize;
  setHeader('Squadre',`${state.settings.teamCount} rose · ${expected} giocatori ciascuna`);
  const cards=state.teams.map((t,i)=>{const roster=teamPlayers(t.id),cap=playerById(t.captainId),avg=roster.length?(roster.reduce((s,p)=>s+p.rating,0)/roster.length).toFixed(1):'—';const ok=roster.length===expected;return `<div class="card team-card" style="--team:${t.color||teamColor(i)}"><div class="team-accent"></div><h3>${esc(t.name)}</h3><div class="team-meta">${roster.length}/${expected} giocatori · livello medio ${avg}${cap?` · capitano ${esc(cap.name)}`:''} ${ok?'<span class="badge green">Rosa completa</span>':'<span class="badge red">Da rigenerare</span>'}</div><div class="roster">${roster.map(p=>`<div class="roster-row"><span class="badge">${esc(roleLabel(p.role))}</span><span class="grow">${esc(p.name)}${t.captainId===p.id?' ©':''}</span><span class="rating">${'★'.repeat(p.rating)}</span></div>`).join('')||'<div class="note">Nessun giocatore</div>'}</div><div style="margin-top:12px"><button class="ghost full" data-edit-team="${t.id}">Nome / capitano</button></div></div>`;}).join('');
  const complete=state.teams.length===state.settings.teamCount && state.teams.every(t=>teamPlayers(t.id).length===expected);
  view.innerHTML=`<div class="section-head"><h2>Le ${state.settings.teamCount} squadre</h2><div class="actions"><button class="${state.teams.length?'ghost':'secondary'}" id="autoTeams">⚖ ${state.teams.length?'Rigenera equilibrate':'Genera equilibrate'}</button>${state.teams.length?'<button class="ghost" id="manualRosters">Gestisci assegnazioni</button>':''}${complete?'<button class="ghost" id="swapPlayers">⇄ Scambia</button>':''}</div></div><div class="card" style="margin-bottom:16px"><div class="target-line"><span>Partecipanti attivi</span><strong>${activePlayers().length}/${state.settings.targetPlayers}</strong></div><p class="note">Le <strong>${state.settings.teamCount} squadre da ${expected} giocatori</strong> sono già assegnate. Il gestore può rinominarle, scambiare o riassegnare manualmente i partecipanti.</p>${state.teams.length&&!complete?'<div class="notice warn" style="margin-top:12px"><span>!</span><span>Almeno una rosa non ha la dimensione prevista. Puoi correggerla con “Gestisci assegnazioni” o rigenerare tutto.</span></div>':''}</div>${cards?`<div class="team-grid">${cards}</div>`:`<div class="empty"><strong>Nessuna squadra</strong>Quando hai inserito tutti i partecipanti, premi “Genera equilibrate”.</div>`}`;
  document.getElementById('autoTeams').onclick=autoBalanceTeams;
  document.getElementById('manualRosters')?.addEventListener('click',openRosterManagerModal);
  document.getElementById('swapPlayers')?.addEventListener('click',openSwapPlayersModal);
  view.querySelectorAll('[data-edit-team]').forEach(b=>b.onclick=()=>openTeamModal(b.dataset.editTeam));
}
function openTeamModal(id){
  const t=teamById(id); if(!t)return;
  const roster=teamPlayers(id);
  openModal(`<h2>Gestisci squadra</h2><div class="form-grid"><div class="field full"><label>Nome squadra</label><div class="team-name-random"><input id="tName" value="${esc(t.name)}" placeholder="Es. Atletico Pasticciotto"><button class="ghost dice-name" id="randomTeamName" type="button" title="Genera un nome simpatico" aria-label="Genera un nome simpatico casuale">🎲</button></div><small>Premi il dado per proporre un nome simpatico; puoi modificarlo prima di salvare.</small></div><div class="field"><label>Colore</label><input id="tColor" type="color" value="${t.color||teamColor(state.teams.indexOf(t))}"></div><div class="field"><label>Capitano</label><select id="tCaptain"><option value="">Da scegliere</option>${roster.map(p=>`<option value="${p.id}" ${t.captainId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div></div><p class="note">La rosa contiene ${roster.length}/${state.settings.rosterSize} giocatori. Gli spostamenti singoli sono bloccati per mantenere tutte le squadre della stessa dimensione.</p><div class="modal-actions"><button class="ghost" data-close>Chiudi</button><button class="primary" id="saveTeam">Salva</button></div>`);
  document.getElementById('randomTeamName').onclick=()=>{
    const input=document.getElementById('tName');
    const used=new Set(state.teams.filter(x=>x.id!==id).map(x=>x.name.trim().toLocaleLowerCase('it')));
    const current=input.value.trim().toLocaleLowerCase('it');
    const available=defaultTeamNames.filter(name=>{const key=name.toLocaleLowerCase('it');return key!==current&&!used.has(key);});
    const pool=available.length?available:defaultTeamNames.filter(name=>name.toLocaleLowerCase('it')!==current);
    input.value=pool[Math.floor(Math.random()*pool.length)]||defaultTeamName(state.teams.indexOf(t));
    input.focus();input.select();
  };
  document.getElementById('saveTeam').onclick=()=>{const name=document.getElementById('tName').value.trim();if(!name)return toast('Inserisci il nome squadra');createSnapshot(`Prima di modificare ${t.name}`);t.name=name.slice(0,80);t.color=document.getElementById('tColor').value;t.captainId=document.getElementById('tCaptain').value||null;save();closeModal();renderTeams();toast('Squadra salvata');};
}
function openRosterManagerModal(){
  if(!state.teams.length)return toast('Crea prima le squadre');
  const playerOptions=activePlayers().map(p=>`<option value="${p.id}">${esc(p.name)} — ${esc(teamById(p.teamId)?.name||'Non assegnato')}</option>`).join('');
  const teamOptions=state.teams.map(t=>`<option value="${t.id}">${esc(t.name)} (${teamPlayers(t.id).length}/${state.settings.rosterSize})</option>`).join('');
  openModal(`<h2>Assegnazione manuale</h2><p class="modal-subtitle">Sposta un partecipante in una squadra oppure lascialo temporaneamente non assegnato.</p><div class="form-grid"><div class="field full"><label>Partecipante</label><select id="rosterPlayer"><option value="">Scegli…</option>${playerOptions}</select></div><div class="field full"><label>Nuova assegnazione</label><select id="rosterTeam"><option value="">Non assegnato</option>${teamOptions}</select></div></div><div class="notice warn" style="margin-top:12px"><span>!</span><span>Un’assegnazione manuale può rendere le rose disuguali. La cabina di regia te lo segnalerà senza impedirti di procedere.</span></div><div class="modal-actions"><button class="ghost" data-close>Annulla</button><button class="primary" id="saveRosterMove">Sposta partecipante</button></div>`);
  document.getElementById('saveRosterMove').onclick=()=>{const p=playerById(document.getElementById('rosterPlayer').value);const nextTeamId=document.getElementById('rosterTeam').value||null;if(!p)return toast('Scegli un partecipante');if(p.teamId===nextTeamId)return toast('Il partecipante è già in questa assegnazione');const target=nextTeamId?teamById(nextTeamId):null;if(target&&teamPlayers(target.id).length>=state.settings.rosterSize&&!confirm(`${target.name} ha già ${teamPlayers(target.id).length} giocatori. Assegnare comunque?`))return;createSnapshot(`Prima di spostare ${p.name}`);state.teams.forEach(t=>{if(t.captainId===p.id&&t.id!==nextTeamId)t.captainId=null;});p.teamId=nextTeamId;save();closeModal();renderTeams();toast('Assegnazione aggiornata');};
}
function openSwapPlayersModal(){
  const assigned=activePlayers().filter(p=>p.teamId&&teamById(p.teamId));
  if(assigned.length<2)return toast('Servono almeno due giocatori assegnati');
  const options=assigned.map(p=>`<option value="${p.id}">${esc(p.name)} — ${esc(teamById(p.teamId)?.name||'')}</option>`).join('');
  openModal(`<h2>Scambia giocatori</h2><p class="note">Lo scambio 1↔1 mantiene invariato il numero di giocatori in ogni rosa.</p><div class="form-grid"><div class="field"><label>Giocatore A</label><select id="swapA"><option value="">Scegli…</option>${options}</select></div><div class="field"><label>Giocatore B</label><select id="swapB"><option value="">Scegli…</option>${options}</select></div></div><div class="modal-actions"><button class="ghost" data-close>Chiudi</button><button class="primary" id="confirmSwap">Scambia</button></div>`);

    }

  }

  document.getElementById('deleteMatch').onclick=()=>{if(!confirm(`Eliminare definitivamente ${home.name} vs ${away.name}?`))return;createSnapshot(`Prima di eliminare ${home.name} vs ${away.name}`);if(m.stage==='group'&&knockoutMatches().length)removeAllKnockout();else if(ko)removeDownstreamKnockout(m.koSize||2);state.matches=state.matches.filter(x=>x.id!==m.id);save();closeModal(true);render();toast('Partita eliminata');};
  document.getElementById('saveMatch').onclick=()=>{

    const scoreChanged=m.status==='played' && (+hs!==+oldHs || +as!==+oldAs);
    if(!ko && scoreChanged && knockoutMatches().length){
      if(!confirm('Questo risultato può cambiare la classifica e il tabellone playoff. La fase finale verrà rigenerata. Continuare?'))return;
    }

    createSnapshot(`Prima di modificare ${home.name} vs ${away.name}`);
    if(!ko&&scoreChanged&&knockoutMatches().length)removeAllKnockout();

    }
    m.stats=draftStats.filter(s=>s.goals||s.assists||s.yellow||s.red||s.mvp);m.mvpPlayerId=mvpRows[0]?.playerId||null;

  };

    } else if(ko && (m.koSize||2)>2){

      removeDownstreamKnockout(m.koSize||2);
    }
    createSnapshot(`Prima di ripristinare ${home.name} vs ${away.name}`);m.homeScore=null;m.awayScore=null;m.status='scheduled';m.stats=[];m.events=[];m.ratings=[];m.ratingsPublished=false;m.referee=null;m.mvpPlayerId=null;delete m.penHome;delete m.penAway;
    save();closeModal(true);render();toast('Partita ripristinata');
  };
}

function suggestedRating(m,playerId){

  return Math.round(clamp(raw,5,10)*2)/2;
}

function miniTable(teamIds){
  const ids=new Set(teamIds);
  const mini=new Map(teamIds.map(id=>[id,{pts:0,gf:0,ga:0,gd:0}]));
  playedMatches('group').forEach(m=>{
    if(!ids.has(m.homeTeamId)||!ids.has(m.awayTeamId))return;
    const h=mini.get(m.homeTeamId),a=mini.get(m.awayTeamId),hs=+m.homeScore,as=+m.awayScore;
    h.gf+=hs;h.ga+=as;a.gf+=as;a.ga+=hs;
    if(hs>as){h.pts+=state.settings.pointsWin;a.pts+=state.settings.pointsLoss;}
    else if(hs<as){a.pts+=state.settings.pointsWin;h.pts+=state.settings.pointsLoss;}
    else{h.pts+=state.settings.pointsDraw;a.pts+=state.settings.pointsDraw;}
  });
  mini.forEach(x=>x.gd=x.gf-x.ga);
  return mini;
}
function standings(){
  const map=new Map(state.teams.map(t=>[t.id,{team:t,pg:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0}]));
  playedMatches('group').forEach(m=>{
    const h=map.get(m.homeTeamId),a=map.get(m.awayTeamId);if(!h||!a)return;
    const hs=+m.homeScore,as=+m.awayScore;h.pg++;a.pg++;h.gf+=hs;h.ga+=as;a.gf+=as;a.ga+=hs;
    if(hs>as){h.w++;a.l++;h.pts+=state.settings.pointsWin;a.pts+=state.settings.pointsLoss;}
    else if(hs<as){a.w++;h.l++;a.pts+=state.settings.pointsWin;h.pts+=state.settings.pointsLoss;}
    else{h.d++;a.d++;h.pts+=state.settings.pointsDraw;a.pts+=state.settings.pointsDraw;}
  });
  const rows=[...map.values()].map(x=>({...x,gd:x.gf-x.ga}));
  const pointGroups=new Map();
  rows.forEach(row=>{if(!pointGroups.has(row.pts))pointGroups.set(row.pts,[]);pointGroups.get(row.pts).push(row);});
  const result=[];
  [...pointGroups.keys()].sort((a,b)=>b-a).forEach(points=>{
    const group=pointGroups.get(points);
    if(group.length===1){result.push(group[0]);return;}
    const mini=miniTable(group.map(x=>x.team.id));
    group.sort((a,b)=>{
      const am=mini.get(a.team.id),bm=mini.get(b.team.id);
      return bm.pts-am.pts || bm.gd-am.gd || bm.gf-am.gf || b.gd-a.gd || b.gf-a.gf || b.w-a.w || a.team.name.localeCompare(b.team.name,'it');
    });
    result.push(...group);
  });
  return result;
}

function aggregateStats(){
  const map=new Map(state.players.map(p=>[p.id,{player:p,goals:0,assists:0,yellow:0,red:0,mvp:0}]));
  playedMatches().forEach(m=>{
    (m.stats||[]).forEach(s=>{const x=map.get(s.playerId);if(!x)return;x.goals+=s.goals||0;x.assists+=s.assists||0;x.yellow+=s.yellow||0;x.red+=s.red||0;x.mvp+=s.mvp?1:0;});
    if(m.mvpPlayerId&&!((m.stats||[]).some(s=>s.playerId===m.mvpPlayerId&&s.mvp))){const x=map.get(m.mvpPlayerId);if(x)x.mvp+=1;}
  });
  return [...map.values()];
}
function aggregateRatings(){
  const map=new Map(state.players.map(player=>[player.id,{player,total:0,count:0,average:0}]));
  playedMatches().filter(m=>m.ratingsPublished).forEach(m=>(m.ratings||[]).forEach(r=>{const row=map.get(r.playerId);if(!row)return;row.total+=+r.score||0;row.count++;}));
  const rows=[...map.values()].filter(row=>row.count>0);rows.forEach(row=>row.average=row.total/row.count);
  return rows.sort((a,b)=>b.average-a.average||b.count-a.count||a.player.name.localeCompare(b.player.name,'it'));
}
function leadingRatings(rows=aggregateRatings()){const first=rows[0];return first?rows.filter(row=>Math.abs(row.average-first.average)<1e-9&&row.count===first.count):[];}
function leadersByValue(rows,key){
  const eligible=rows.filter(x=>(+x[key]||0)>0);
  if(!eligible.length)return [];
  const best=Math.max(...eligible.map(x=>+x[key]||0));
  return eligible.filter(x=>(+x[key]||0)===best).sort((a,b)=>a.player.name.localeCompare(b.player.name,'it'));
}
function teamPerformanceStats(){
  const map=new Map(state.teams.map(team=>[team.id,{team,matches:0,goalsFor:0,goalsAgainst:0,cleanSheets:0}]));
  playedMatches().forEach(m=>{
    const home=map.get(m.homeTeamId),away=map.get(m.awayTeamId),hs=+m.homeScore||0,as=+m.awayScore||0;
    if(home){home.matches++;home.goalsFor+=hs;home.goalsAgainst+=as;if(as===0)home.cleanSheets++;}
    if(away){away.matches++;away.goalsFor+=as;away.goalsAgainst+=hs;if(hs===0)away.cleanSheets++;}
  });
  return map;
}
function goalkeeperStats(){
  const teamStats=teamPerformanceStats(),maxMatches=Math.max(0,...[...teamStats.values()].map(x=>x.matches)),minimumMatches=maxMatches>1?2:1;
  return state.players.filter(p=>p.role==='POR'&&p.teamId&&teamStats.get(p.teamId)?.matches>=minimumMatches).map(player=>{
    const team=teamStats.get(player.teamId);
    return {player,team:team.team,matches:team.matches,goalsAgainst:team.goalsAgainst,cleanSheets:team.cleanSheets,average:team.goalsAgainst/team.matches};
  }).sort((a,b)=>a.goalsAgainst*b.matches-b.goalsAgainst*a.matches||b.cleanSheets-a.cleanSheets||b.matches-a.matches||a.player.name.localeCompare(b.player.name,'it'));
}
function leadingGoalkeepers(rows=goalkeeperStats()){
  const first=rows[0];if(!first)return [];
  return rows.filter(x=>x.goalsAgainst*first.matches===first.goalsAgainst*x.matches&&x.cleanSheets===first.cleanSheets&&x.matches===first.matches);
}
function fairPlayStats(){
  const performance=teamPerformanceStats(),map=new Map(state.teams.map(team=>[team.id,{team,matches:performance.get(team.id)?.matches||0,yellow:0,red:0,points:0}]));
  playedMatches().forEach(m=>(m.stats||[]).forEach(s=>{const player=playerById(s.playerId),row=map.get(player?.teamId);if(!row)return;row.yellow+=s.yellow||0;row.red+=s.red||0;}));
  const rows=[...map.values()].filter(x=>x.matches>0);rows.forEach(x=>x.points=x.yellow+x.red*3);
  return rows.sort((a,b)=>a.points-b.points||a.red-b.red||a.yellow-b.yellow||a.team.name.localeCompare(b.team.name,'it'));
}
function leadingFairPlayTeams(rows=fairPlayStats()){
  const first=rows[0];if(!first)return [];
  return rows.filter(x=>x.points===first.points&&x.red===first.red&&x.yellow===first.yellow);
}
function awardsAreFinal(){

function settingsPreviewHtml(s=state.settings){
  const c=rosterCompatibility(s.targetPlayers,s.rosterSize);

    const totals=[c.lowerTotal,c.upperTotal].filter((v,i,a)=>v&&v>=10&&a.indexOf(v)===i);
    return `<div class="card" style="border-color:#d6a23f;background:#fff8e8"><strong>Configurazione non valida</strong><p class="note" style="margin:8px 0 0">${s.targetPlayers} partecipanti non sono divisibili in rose da ${s.rosterSize}. ${totals.length?`Con rosa ${s.rosterSize}: ${totals.map(v=>`${v} partecipanti = ${v/s.rosterSize} squadre`).join(' oppure ')}.`:''}</p></div>`;
  }
  const teams=c.teams;
  const effective={...s,teamCount:teams,bronzeFinal:s.playoffs&&knockoutBracketSize(teams,{...s,teamCount:teams})>=4&&s.bronzeFinal};
  return `<div class="schedule-summary"><span class="status-chip">${teams} squadre</span><span class="status-chip">${s.rosterSize} giocatori ciascuna</span><span class="status-chip">${groupGamesExpected(teams,effective)} girone</span><span class="status-chip">${formatMode(effective)}</span><span class="status-chip">${playoffText(effective)}</span><span class="status-chip">${humanDuration(estimatedTournamentMinutes(effective))}</span></div>`;
}
function readSettingsForm(){
  const targetPlayers=clamp(+document.getElementById('setTarget').value||25,10,200);
  const rosterSize=clamp(+document.getElementById('setRoster').value||5,5,20);
  const teamCount=calcTeamCount(targetPlayers,rosterSize);
  const tournamentFormat=document.getElementById('setFormat').value;
  const playoffs=tournamentFormat!=='league';
  const base={
    name:(document.getElementById('setName').value||'Copparì').trim().slice(0,80)||'Copparì',
    edition:(document.getElementById('setEdition').value||'Edizione 2026').trim().slice(0,80)||'Edizione 2026',
    venue:document.getElementById('setVenue').value.trim().slice(0,120),organizer:document.getElementById('setOrganizer').value.trim().slice(0,120),
    targetPlayers,rosterSize,teamCount,
    scheduleMode:document.getElementById('setMode').value,tournamentFormat,playoffs,
    startTime:'00:00',periods:2,
    bronzeFinal:document.getElementById('setBronze').value==='1',
    matchMinutes:clamp(+document.getElementById('setMinutes').value||20,2,120),
    halftimeMinutes:clamp(numOr(document.getElementById('setHalftime').value,2),0,30),
    changeMinutes:clamp(numOr(document.getElementById('setChange').value,4),0,60),
    pointsWin:clamp(numOr(document.getElementById('setWin').value,3),-20,100),
    pointsDraw:clamp(numOr(document.getElementById('setDraw').value,1),-20,100),
    pointsLoss:clamp(numOr(document.getElementById('setLoss').value,0),-20,100),
    touchGuard:document.getElementById('setTouchGuard').value==='1',
    hapticFeedback:document.getElementById('setHaptic').checked,
    soundFeedback:document.getElementById('setSound').checked
  };
  if(!base.playoffs||knockoutBracketSize(teamCount,base)<4)base.bronzeFinal=false;
  return base;
}
function updateSettingsPreview(){
  const preview=document.getElementById('settingsPreview');if(!preview)return;

  const bronze=document.getElementById('setBronze');
  if(bronze){bronze.disabled=!draft.playoffs||knockoutBracketSize(draft.teamCount,draft)<4;if(bronze.disabled)bronze.value='0';}
  const valid=rosterCompatibility(draft.targetPlayers,draft.rosterSize).valid;
  const saveBtn=document.getElementById('saveSettings');if(saveBtn)saveBtn.disabled=!valid;
  preview.innerHTML=settingsPreviewHtml(draft);
}

  if(next)lines.push(`Prossima: ${teamById(next.homeTeamId)?.name||'?'} vs ${teamById(next.awayTeamId)?.name||'?'} (${stageLabel(next)})`);
  if(table.length)lines.push('', 'Classifica:',...table.map((x,i)=>`${i+1}. ${x.team.name} — ${x.pts} pt (${x.gf}:${x.ga})`));
  const final=state.matches.find(m=>m.stage==='final'&&m.status==='played');if(final){const winner=teamById(matchWinner(final));if(winner)lines.push('',`Vincitore: ${winner.name} 🏆`);}
  if(awardsAreFinal())lines.push('','Premi finali:',...awardsTextLines());
  return lines.join('\n');
}
async function shareSummary(){const text=summaryText();try{await navigator.clipboard.writeText(text);toast('Riepilogo copiato');}catch{const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();toast('Riepilogo copiato');}}
function backupFileName(){const safe=(state.settings.name||'coppari').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'coppari';return `${safe}-backup-${new Date().toISOString().slice(0,10)}.json`;}
function downloadBackupFile(file){const a=document.createElement('a'),url=URL.createObjectURL(file);a.href=url;a.download=file.name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
async function exportBackup(){
  const file=new File([JSON.stringify(state,null,2)],backupFileName(),{type:'application/json'});
  let shared=false;
  try{
    const canShareFiles=typeof navigator.share==='function'&&typeof navigator.canShare==='function'&&navigator.canShare({files:[file]});
    if(canShareFiles){await navigator.share({files:[file],title:`Backup ${state.settings.name}`,text:'Backup completo del torneo Copparì'});shared=true;}
    else downloadBackupFile(file);
  }catch(error){
    if(error?.name==='AbortError')return;
    try{downloadBackupFile(file);}catch{return toast('Impossibile esportare il backup su questo dispositivo',4200);}
  }
  storageSet('coppari.v3.lastExport',new Date().toISOString());
  toast(shared?'Backup condiviso: salvalo in File':'Backup esportato');
  if(currentView==='home')renderHome();
}
function importBackup(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const raw=JSON.parse(reader.result);if(!raw||typeof raw!=='object'||!Array.isArray(raw.players)||!Array.isArray(raw.teams)||!Array.isArray(raw.matches))throw new Error('schema');if(!confirm(`Importare il backup “${file.name}” e sostituire i dati attuali?`))return;createSnapshot('Prima di importare un backup');const data=normalizeState(raw);Object.keys(state).forEach(k=>delete state[k]);Object.assign(state,data);save();currentView='home';sessionSet('coppari.currentView','home');closeModal(true);render();toast('Backup importato e verificato');}catch{toast('Backup non valido o danneggiato',3500);}};reader.readAsText(file);e.target.value='';}
function openResetModal(){openModal(`<h2>Azzera tutti i dati</h2><p class="modal-subtitle">Questa azione rimuove torneo, rose, calendario, risultati e statistiche da questo dispositivo.</p><div class="notice danger"><span>!</span><span>Prima dell’azzeramento verrà creato un punto di ripristino locale.</span></div><div class="field" style="margin-top:14px"><label>Scrivi <strong>AZZERA</strong> per confermare</label><input id="resetPhrase" autocomplete="off" placeholder="AZZERA"></div><div class="modal-actions"><button class="ghost" data-close>Annulla</button><button class="danger" id="confirmReset" disabled>Azzeramento definitivo</button></div>`);const input=document.getElementById('resetPhrase'),button=document.getElementById('confirmReset');input.addEventListener('input',()=>button.disabled=input.value.trim().toUpperCase()!=='AZZERA');button.onclick=resetAll;}
function resetAll(){createSnapshot('Prima dell’azzeramento completo');const fresh=emptyState();Object.keys(state).forEach(k=>delete state[k]);Object.assign(state,fresh);save();currentView='home';sessionSet('coppari.currentView','home');closeModal(true);render();toast('Dati azzerati · ripristino disponibile');}

document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('.nav-item');if(b)navigate(b.dataset.view);});
document.getElementById('menuBtn').onclick=()=>sidebar.classList.toggle('open');
document.getElementById('mobileNav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)return navigate(b.dataset.view);if(e.target.closest('[data-menu-open]'))sidebar.classList.add('open');});
document.getElementById('guideBtn').onclick=()=>openManagerGuide(false);
document.getElementById('liveShareBtn').onclick=openLiveShareModal;
document.getElementById('exportBtn').onclick=exportBackup;
document.getElementById('importInput').onchange=importBackup;
document.getElementById('shareBtn').onclick=shareSummary;
document.getElementById('printBtn').onclick=()=>window.print();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'){updateScreenWakeUI();return;}syncScreenWakeLock();if(liveRole&&!liveConnected&&!liveEnded)connectToLiveHost();});
window.addEventListener('online',()=>{if(liveRole&&!liveConnected&&!liveEnded)connectToLiveHost();});
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY)toast('I dati sono cambiati in un’altra scheda: ricarica per allinearli',4200);});
const joiningLiveSession=initLiveSharing();
render();
updateSaveIndicator();
if(!joiningLiveSession)setTimeout(maybeShowInitialGuide,250);

</script>
